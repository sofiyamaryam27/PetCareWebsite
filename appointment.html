    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1 style="color: rgb(243, 243, 247);">🐾 Paw Palace</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="pets.html">Pets</a> |

            <a href="dashboard.html">Dashboard</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <!-- Appointment Section -->

    <section id="appointment">

        <h2>📅 Book an Appointment</h2>

        <form>

            <label>Owner Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Pet Name</label>
            <input type="text" placeholder="Enter pet name">

            <label>Select Pet</label>

            <select>
                <option>Dog</option>
                <option>Cat</option>
                <option>Bird</option>
                <option>Rabbit</option>
            </select>

            <label>Select Service</label>

            <select>
                <option>Health Check-up</option>
                <option>Vaccination</option>
                <option>Pet Grooming</option>
                <option>Pet Boarding</option>
                <option>Pet Food Consultation</option>
            </select>

            <label>Appointment Date</label>
            <input type="date">

            <label>Preferred Time</label>
            <input type="time">

            <label>Special Request</label>

            <textarea rows="5" placeholder="Enter your message"></textarea>

            <input type="submit" value="Book Appointment">

        </form>

    </section>

    <!-- Footer -->

    <footer>

        <h3>Contact Us</h3>

        <p>Email : petcare@gmail.com</p>

        <p>Phone : +91 9876543210</p>

        <a href="https://www.facebook.com">Facebook</a>
        <a href="https://www.instagram.com">Instagram</a>
        <a href="https://www.youtube.com">YouTube</a>

        <p>&copy; 2026 Pet Care Website. All Rights Reserved.</p>

    </footer>
